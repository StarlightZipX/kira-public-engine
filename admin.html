<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kira Admin Dashboard (God Mode)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #111827; color: #f9fafb; padding: 2rem; }
        h1 { color: #3b82f6; border-bottom: 1px solid #374151; padding-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
        th, td { border: 1px solid #374151; padding: 1rem; text-align: left; }
        th { background: #1f2937; }
        .role-User { color: #10b981; font-weight: bold; }
        .role-Kira { color: #3b82f6; font-weight: bold; }
        .session-id { font-family: monospace; color: #9ca3af; font-size: 0.85rem; }
    </style>
</head>
<body>
    <h1>🛡️ แผงควบคุมลับ (Kira Secret Admin Dashboard)</h1>
    <p>ดูการสนทนาทั้งหมดแบบ Real-time</p>
    
    <table>
        <thead>
            <tr>
                <th>เวลา (Time)</th>
                <th>ผู้ใช้ (Session ID)</th>
                <th>ผู้พูด (Role)</th>
                <th>ข้อความ (Message)</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log[1] }}</td>
                <td class="session-id">{{ log[0] }}</td>
                <td class="role-{{ log[2] }}">{{ log[2] }}</td>
                <td>{{ log[3] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
